name: kosh_finance
description: Personal and business finance tracker for Kosh — income, expenses, investments and customers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path: ^1.9.0
  fl_chart: ^0.69.2
  intl: ^0.19.0
  uuid: ^4.5.1
  provider: ^6.1.2
  sqflite_common_ffi: ^2.3.4+4
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
